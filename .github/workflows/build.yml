name: Go

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # go:embed bakes the bundle in at compile time, so this must run before the
    # Go build - otherwise the released binary serves pages that load nothing.
    - name: Bundle the frontend
      run: deno task build

    - name: Check the frontend
      run: |
        deno task check
        deno task lint
        deno task test

    - name: Build
      run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o pi-player

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    # Most of this project's concurrency - the websocket, the directory
    # watcher, overlapping API calls - is only checked under the race
    # detector. It costs a couple of seconds since the test bcrypt cost came
    # down, so there is no reason not to run it.
    - name: Test with the race detector
      run: go test -race -count=2 ./...

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./pi-player

