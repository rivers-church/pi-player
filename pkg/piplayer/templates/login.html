<!DOCTYPE html>
<html lang="en" class="wa-theme-default wa-palette-default wa-dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login - {{.location}}</title>
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/dist/ui.css">
  <link rel="stylesheet" href="/assets/dist/css/pages.css">
</head>

<!-- Native form controls, deliberately: Web Awesome styles them through
     native.css, and this page has to work even if the script bundle doesn't
     load. A custom element that never upgrades is a login nobody can use. -->

<body>
  <main class="page page--narrow">
    <h1>{{.location}} Login</h1>

    {{if .flashMessage}}
    <p class="flash" role="alert">{{.flashMessage}}</p>
    {{end}}

    <form action="/login" method="POST" id="frmLogin" class="stack">
      <label for="txtUsername">Username</label>
      <input type="text" id="txtUsername" name="username" autocomplete="username" autofocus>

      <label for="txtPassword">Password</label>
      <input type="password" id="txtPassword" name="password" autocomplete="current-password">

      <button type="submit" class="wa-brand">Login</button>
    </form>
  </main>
</body>

</html>
